name: Rubocop

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Determine Ruby version for ruby/setup-ruby
        shell: bash
        run: |
          RUBY_VERSION=${{ vars.RUBY_VERSION }}

          if [[ -r .rubocop.yml ]]
          then
            RUBY_VERSION=$( \
              command grep \
              -E '^\s*TargetRubyVersion:\s*[0-9]+(\.[0-9]+)*' \
              .rubocop.yml \
              | command awk '{print $2}' \
            )
          fi

          if [[ -z $RUBY_VERSION ]]
          then
            # Let setup-ruby determine the Ruby version if no .ruby-version,
            # .tool-versions or mise.toml file exists
            RUBY_VERSION=default
          fi

          echo "RUBY_VERSION=$RUBY_VERSION" >> $GITHUB_ENV
      - uses: ruby/setup-ruby@v1
        with:
          # input ruby-version needs to be specified if no .ruby-version,
          # .tool-versions or mise.toml file exists
          #
          # Use the version that matches the one in gemspec & .rubocop.yml
          ruby-version: ${{ env.RUBY_VERSION }}
      # Direct rubocop run: the third-party action's JSON parsing dies
      # with an empty payload whenever rubocop exits abnormally
      # (observed on feature/diff-canon too), reporting a JSON::ParserError
      # instead of the real failure. Running rubocop directly surfaces
      # actual offenses and crashes.
      - name: Install pinned rubocop gems
        run: gem install rubocop:1.72.2 rubocop-performance:1.24.0 rubocop-rspec:3.10.2 rubocop-rake:0.7.1
      # Lint only files changed on the PR — matches the third-party
      # action's prior behaviour and avoids flooding on pre-existing
      # offenses the fleet has not yet cleaned up.
      - name: Rubocop (changed files)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD | grep -E '\.(rb|rake)$|Gemfile(\.|$)|Rakefile$' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Ruby files changed; skipping rubocop"
            exit 0
          fi
          echo "Linting ${#files[@]} changed file(s):"
          printf '  %s\n' "${files[@]}"
          rubocop --format progress --format github --force-exclusion "${files[@]}"
