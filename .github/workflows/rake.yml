name: rake

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Public sample/template coverage (Linux, Ruby 3.3)
        type: choice
        options: [all-public, core]
        default: all-public
        required: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.freeze.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      # The CLI development bundle includes private flavor source dependencies,
      # even when the selected corpus is public. Reuse the existing read setup.
      - uses: metanorma/ci/gh-rubygems-setup-action@083ae028fa7a8cdaaf5e6152ca07acbec092cf52
        with:
          token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - name: Freeze all common dependencies and corpus revisions
        id: freeze
        env:
          COMPARISON_SCOPE: ${{ inputs.scope }}
        run: python3 .github/scripts/plurimath_compare_prepare.py --scope "$COMPARISON_SCOPE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plurimath-comparison-inputs
          include-hidden-files: true
          path: |
            .comparison/manifest.json
            .comparison/Gemfile
            .comparison/Gemfile.lock
            .comparison/resolve.log

  compare:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plurimath-comparison-inputs
          path: .comparison
      - uses: metanorma/ci/gh-rubygems-setup-action@083ae028fa7a8cdaaf5e6152ca07acbec092cf52
        with:
          token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
      - uses: metanorma/ci/tool-setup-action@083ae028fa7a8cdaaf5e6152ca07acbec092cf52
        with:
          setup-tools: inkscape,ghostscript,xml2rfc
      - name: Compare baseline and both exact Plurimath commits
        env:
          COMPARISON_CASE: ${{ matrix.case }}
        run: >-
          python3 .github/scripts/plurimath_compare_run.py
          --case "$COMPARISON_CASE"
          --work-root "$RUNNER_TEMP/plurimath-comparison"
          --output "$GITHUB_WORKSPACE/comparison-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plurimath-${{ matrix.case }}
          path: comparison-results
          if-no-files-found: error
